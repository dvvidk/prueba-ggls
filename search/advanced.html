<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Google Search</a>
    </nav>

    <main class="advanced-page">
        <div class="advanced-header">
            <span class="logo" aria-hidden="true"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></span>
            <h1>Advanced Search</h1>
        </div>

        <form class="advanced-form" action="https://www.google.com/search" method="get">
            <h2>Find pages with…</h2>

            <div class="field">
                <label for="as_q">all these words:</label>
                <input id="as_q" type="text" name="as_q">
            </div>

            <div class="field">
                <label for="as_epq">this exact word or phrase:</label>
                <input id="as_epq" type="text" name="as_epq">
            </div>

            <div class="field">
                <label for="as_oq">any of these words:</label>
                <input id="as_oq" type="text" name="as_oq">
            </div>

            <div class="field">
                <label for="as_eq">none of these words:</label>
                <input id="as_eq" type="text" name="as_eq">
            </div>

            <input class="btn-advanced" type="submit" value="Advanced Search">
        </form>
    </main>
</body>
</html>
